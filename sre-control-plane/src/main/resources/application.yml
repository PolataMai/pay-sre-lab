spring:
  application:
    name: sre-control-plane
  datasource:
    url: ${CONTROL_DB_URL:jdbc:postgresql://localhost:5432/paysre_control}
    username: ${CONTROL_DB_USERNAME:paysre}
    password: ${CONTROL_DB_PASSWORD:paysre}
  flyway:
    enabled: true

paysre:
  payment:
    base-url: ${PAYMENT_SERVICE_BASE_URL:http://localhost:8080}
  channel:
    base-url: ${CHANNEL_SIMULATOR_BASE_URL:http://localhost:8081}
  investigation:
    model-timeout: ${INVESTIGATION_MODEL_TIMEOUT:PT10S}

server:
  port: ${CONTROL_PLANE_PORT:8082}

management:
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
    export:
      otlp:
        enabled: ${OTEL_TRACES_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      deployment.environment: ${DEPLOYMENT_ENVIRONMENT:lab}
    tracing:
      limits:
        max-attributes: 64
        max-attribute-value-length: 256
        max-events: 64
        max-links: 16
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          connect-timeout: 1s
          timeout: 3s
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
