server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The console expects the control plane at /api. Vite's dev proxy
  # makes that work locally; in docker compose we point /api at the
  # sre-control-plane service.
  location /api/ {
    proxy_pass http://sre-control-plane:8082/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /benchmark-baseline.md {
    # The baseline report is regenerated by the e2e-tests target
    # in CI; in the local docker compose stack the file is mounted
    # into the nginx html directory by the build step.
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}