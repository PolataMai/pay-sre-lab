name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify reactor
        run: mvn -B -ntp clean verify
      - name: Validate Compose configuration
        run: docker compose -f deploy/compose.yaml config --quiet
      - name: Start the full evidence stack
        run: >-
          docker compose -f deploy/compose.yaml up -d --build --wait
          --wait-timeout 360
      - name: Prove the metric-log-trace investigation
        env:
          PAY_SRE_COMPOSE_E2E: "true"
        run: >-
          mvn -B -ntp -pl e2e-tests -am
          -Dtest=ChannelTimeoutButSuccessE2ETest
          -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Capture Compose diagnostics
        if: failure()
        run: |
          docker compose -f deploy/compose.yaml ps --all > compose-status.txt || true
          docker compose -f deploy/compose.yaml logs --no-color > compose.log || true
          docker compose -f deploy/compose.yaml exec -T payment-service sh -c \
            'find /var/log/paysre -maxdepth 1 -type f -exec sh -c '\''echo "--- $1"; wc -c "$1"; tail -n 200 "$1"'\'' _ {} \;' \
            > application-log-files.txt || true
      - name: Stop the evidence stack
        if: always()
        run: docker compose -f deploy/compose.yaml down -v --remove-orphans
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verification-diagnostics
          path: |
            **/target/surefire-reports/**
            compose-status.txt
            compose.log
            application-log-files.txt
          if-no-files-found: ignore
